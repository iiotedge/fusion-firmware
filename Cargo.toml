[package]
name = "fusion-firmware"
version = "1.2.0"
edition = "2021"
authors = ["Santosh <CEO @ IIoTEdge>"]
description = "Config-driven edge vision platform in Rust: RTSP/ONVIF, on-device AI detection, cluster mesh, cloud relay, QR device onboarding, persist-first telemetry, and southbound machine-data ingestion."
license = "MIT"
repository = "https://github.com/iiotedge/fusion-firmware"

[dependencies]
# ==========================================================
# IIoTEdge SDK — consumed as-is (never modified from this repo).
# Persist-first telemetry pipeline, GDE/Sparkplug northbound,
# southbound machine drivers (serial, CAN, Modbus, …), TLS/TPM.
# ==========================================================
iiotedge-core = { path = "../iiotedge-lib/crates/iiotedge-core" }
iiotedge-storage = { path = "../iiotedge-lib/crates/iiotedge-storage" }
iiotedge-security = { path = "../iiotedge-lib/crates/iiotedge-security" }
iiotedge-protocols = { path = "../iiotedge-lib/crates/iiotedge-protocols", default-features = false, features = [
    "mqtt",
    "serial",
    "canbus", # SocketCAN — inert on non-Linux hosts
] }
tokio = { version = "1.38", features = ["rt-multi-thread", "sync", "time", "macros"] }
bytes = "1.6"

# Concurrency & Memory
crossbeam = "0.8.4"
parking_lot = "0.12.3"

# Media & Streaming
gstreamer = "0.25.0"
gstreamer-app = "0.25.0"
gstreamer-rtsp-server = "0.25.0"

# AI & Math
# NOTE: `ort` is declared per-target below (disjoint tables — a shared entry
# would union features across platforms): Linux builds dlopen
# libonnxruntime.so at runtime (load-dynamic, like the RKNN backend loads
# librknnrt.so), dev hosts statically link pyke's downloaded binaries.
ndarray = "0.17.2"
sha2 = "0.10.8" # model fingerprinting (fleet-auditable model identity)

# Networking & Telemetry (uplink MQTT comes from iiotedge-lib's engine;
# rumqttc here serves ONLY the command-channel subscriber — same version as
# the lib so the dependency is shared, not duplicated)
rumqttc = { version = "0.24", features = ["use-rustls"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
prometheus = "0.13.3"

toml = "0.8.10"
thiserror = "1.0.58"

# ONVIF (SOAP-over-HTTP device/media services + WS-Discovery)
tiny_http = "0.12.0"
uuid = { version = "1.10.0", features = ["v4", "v5"] }
chrono = { version = "0.4.38", default-features = false, features = ["clock"] }

# AI detection rules (src/ai/actions.rs): the `webhook` action's outbound
# HTTP POST. Blocking client, not reqwest/hyper — this fires from a plain
# worker thread (src/ai/actions.rs's WebhookDispatcher), not the tokio
# runtime telemetry already owns, so there's no async runtime to hand it to.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

# PTZ (src/ptz/): Pelco-D motor control over RS-485/RS-232. Cross-platform
# (not Linux-gated like the other hardware drivers below) so a USB-RS485
# adapter works for local dev/testing the same as on a deployed device —
# same reasoning as MOCK camera support.
serialport = "4.6"

# QR-code device onboarding (Phase 12, src/onboarding.rs): pure-Rust QR
# matrix generation + PNG encoding, no system codec dependency.
qrcode = "0.14.1"
image = { version = "0.25", default-features = false, features = ["png"] }

# Observability & Config
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["json", "env-filter"] }
config = "0.14.0"
suppaftp = { version = "10.0.1", default-features = false, features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
libc = "0.2.186"
sha1 = "0.11.0"
base64 = "0.22.1"
socket2 = "0.6.5"

# Matter (Phase 19c, src/matter/): commissionable Matter device exposing
# camera clusters (WebRTC Transport Provider, Camera AV Stream/Settings,
# Zone Management) plus PTZ/zone reflection into this firmware's existing
# controllers. Cross-platform, not Linux-gated — `os` feature's built-in
# mDNS (if-addrs-based, no astro-dnssd/zeroconf/D-Bus needed) and str0m's
# sans-IO design both work on macOS dev hosts the same as on the Radxa
# target, so this can be developed/verified locally like everything else
# in this firmware. Test-only device attestation (rs-matter's own
# TEST_DEV_ATT/COMM/DET, no real CSA certificate) until a real
# provisioning story exists — same "for now" call as Phase 12c.
# NOT enabling the `"groups"` feature: it gates both the Groups cluster
# AND rs-matter's Groupcast multicast-messaging transport path, which
# tries to join an IPv6 multicast group on interface index 0 ("any") —
# real, confirmed on this dev host: macOS/BSD's IPv6 stack rejects that
# join (StdIoError), unlike Linux, which tolerates it. The Groups cluster
# itself is for lighting/scene group control, not needed for a Camera
# device — real, working camera functionality now beats chasing a
# platform multicast quirk for a cluster this device type doesn't need.
# Revisit only if a real controller integration test shows it's actually
# required (see TODO.md Phase 19c).
rs-matter = "0.3.0"
# `Zone.name`/`.color` (Zone Management cluster) are `heapless::String<N>`
# — rs-matter re-exports the TYPE (aliased `HString`) but not the crate
# itself, so constructing one in src/matter/camera.rs needs this as a
# direct dependency. Pinned to the exact version rs-matter 0.3.0 itself
# depends on (verified in its Cargo.toml) so the two `heapless::String`
# types are the same type, not two incompatible versions.
heapless = "0.9"
# Cross-platform network-interface enumeration for the built-in mDNS
# responder (src/matter/mdns.rs) — rs-matter's own `os` feature pulls
# this in as an OPTIONAL dependency for its own internal use, which does
# NOT make it available to this crate's code; needed directly here too.
# Pinned to the exact version rs-matter 0.3.0 depends on.
if-addrs = "0.15"
# Real WebRTC (ICE/DTLS/SRTP) in the sans-IO style — bridges the Camera
# cluster's negotiated session to this firmware's actual H.264 stream.
# 2M+ downloads, actively maintained; verified against the real crate
# metadata (crates.io API), not assumed.
str0m = "0.23"
# Single-threaded async plumbing for the per-WebRTC-session driver
# (src/matter/camera.rs::session_loop) — same crates rs-matter's own
# webrtc_camera reference example uses for the identical job, verified
# against its real Cargo.toml (not guessed): a `LocalExecutor` per Matter
# node running one task per active session, `Async<UdpSocket>` for
# non-blocking I/O, `select` to race a socket recv against a timeout.
async-io = "2"
async-executor = "1"
async-channel = "2"
embassy-futures = "0.1"
futures-lite = "2"
# `async-executor`'s `LocalExecutor` (used by Str0mShared::drive) pulls in
# `embassy-executor-timer-queue` transitively, which references an extern
# `_embassy_time_queue_item_from_waker` symbol that only gets DEFINED once
# something provides a concrete timer-queue implementation — a real
# link-time gap invisible to `cargo check`/`clippy` (neither links a
# binary) and, confusingly, absent from `cargo test`'s own link (different
# feature unification pulls something else in) but real for `cargo build
# --bin`. Same fix rs-matter's own reference example's Cargo.toml uses for
# the identical symbol.
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
# `Dataver::new_rand`/`default_crypto` take an `R: RngCore`/`CryptoRngCore`
# bound from rs-matter's OWN re-export of rand_core — verified as 0.6 in
# rs-matter 0.3.0's installed Cargo.toml (its optional `rand` dependency
# is 0.8, NOT the newer 0.10 the upstream repo's in-development examples
# crate has since moved to; pinning to what this installed rs-matter
# version actually resolves, not what a newer git-main example implies,
# is the same discipline as the WHIP element-name lesson earlier this
# project). `features = ["std"]` turns on `OsRng`, unified across the
# whole dependency graph's shared rand_core 0.6.4 build.
rand_core = { version = "0.6", features = ["std"] }
# Bridges rs-matter's `log`-crate diagnostics into the SAME
# tracing-subscriber this firmware already initializes at boot, so
# commissioning/session logs show up in one place instead of nowhere.
tracing-log = "0.2"
# str0m -> dimpl -> rcgen 0.14.8 fails to compile against time >= 0.3.48
# (a real, documented coherence regression in that `time` release, not
# guessed: rcgen's blanket `impl<T: Into<String>> From<T>` spuriously
# conflicts with time's associated-type-projected `From<HourBase>` impl).
# This project's own dependency tree already resolves `time` to 0.3.55
# via rustls/webpki-roots, so without this pin the build would fail the
# moment str0m is added. Confirmed against rs-matter's own examples
# Cargo.toml, which carries the identical pin for the identical reason.
time = { version = ">=0.3, <0.3.48", default-features = false }

# ==========================================================
# LINUX ONLY - Hardware Drivers (Ignored on macOS/Windows)
# ==========================================================
[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14.0"
nix = "0.31.2"
core_affinity = "0.8.3"
# Runtime dlopen of vendor NPU runtimes (librknnrt.so) — one binary per
# fleet, capability-detected on device instead of link-time coupling.
libloading = "0.8.5"
# ONNX Runtime via dlopen (no static onnxruntime in the cross link; a device
# without libonnxruntime.so degrades gracefully — and Rockchip fleets use
# ai.runtime = "rknn" anyway).
ort = { version = "2.0.0-rc.12", default-features = false, features = [
    "std",
    "tracing",
    "api-24",
    "load-dynamic",
] }
gpio-cdev = "0.6.0"
# Bluetooth LE cluster transport (BlueZ via D-Bus) — genuinely offline
# peer-to-peer for sites with no WiFi network at all. Linux-only; the
# cluster module degrades to "unavailable" elsewhere (see cluster/bluetooth.rs).
bluer = { version = "0.17", default-features = false, features = ["bluetoothd", "l2cap"] }

# Dev hosts (macOS/Windows): static link of pyke's downloaded ONNX Runtime —
# AI works out of the box with no system install.
[target.'cfg(not(target_os = "linux"))'.dependencies]
ort = "2.0.0-rc.12"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3.17" # SIGTERM/SIGINT graceful shutdown

[build-dependencies]
pkg-config = "0.3.30"
