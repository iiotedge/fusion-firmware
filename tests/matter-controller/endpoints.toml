# Config-driven endpoints for the real-controller harness. Every sensor source
# is `push:` so the harness can feed values over HTTP (POST /signals/<name>)
# and read them back over Matter; every actuator sink is `signal:` (or virtual)
# so a command given over Matter can be observed with GET /signals. Ids are
# pinned so the test is deterministic.

[[matter.endpoints]]
kind = "temperature_sensor"
name = "Boiler temp"
source = "push:boiler_temp"
endpoint = 20
poll_ms = 200

[[matter.endpoints]]
kind = "humidity_sensor"
name = "Room humidity"
source = "push:room_rh"
endpoint = 21
poll_ms = 200

[[matter.endpoints]]
kind = "pressure_sensor"
name = "Barometer"
source = "push:hpa"
endpoint = 22
poll_ms = 200

[[matter.endpoints]]
kind = "illuminance_sensor"
name = "Ambient light"
source = "push:lux"
endpoint = 23
poll_ms = 200

[[matter.endpoints]]
kind = "flow_sensor"
name = "Water flow"
source = "push:flow"
endpoint = 24
poll_ms = 200

[[matter.endpoints]]
kind = "occupancy_sensor"
name = "Radar presence"
source = "push:presence"
occupancy_type = "radar"
endpoint = 25
poll_ms = 200

[[matter.endpoints]]
kind = "contact_sensor"
name = "Door"
source = "push:door"
endpoint = 26
poll_ms = 200

# A second temperature sensor: two endpoints sharing a device type MUST carry
# distinct TagLists (Matter Core spec 9.5), which the harness verifies.
[[matter.endpoints]]
kind = "temperature_sensor"
name = "Outlet temp"
source = "push:outlet_temp"
endpoint = 27
poll_ms = 200

# --- Actuators ---------------------------------------------------------------

[[matter.endpoints]]
kind = "on_off_light"
name = "Lamp"
sink = "signal:lamp"
endpoint = 30

[[matter.endpoints]]
kind = "on_off_plug"
name = "Heater plug"
sink = "signal:plug"
endpoint = 31

# Three real speeds, so Low/Medium/High are all valid.
[[matter.endpoints]]
kind = "fan"
name = "Ceiling fan"
sink = "signal:fan"
fan_speeds = "off_low_med_high"
endpoint = 32

# A second light: shares device type 0x0100 with endpoint 30, so the two must
# carry distinct TagLists.
[[matter.endpoints]]
kind = "on_off_light"
name = "Porch lamp"
sink = "signal:porch"
endpoint = 33

# The plain-relay fan: one speed (Off/High), so Low must be refused.
[[matter.endpoints]]
kind = "fan"
name = "Vent fan"
sink = "virtual"
endpoint = 34

# --- Switches (events) --------------------------------------------------------
# Fed by pushed signals, so the harness presses the button over HTTP. A pushed
# level is already clean, so debounce is off; timings are short to keep the run
# quick but still well above the 10 ms poll.

[[matter.endpoints]]
kind = "generic_switch"
name = "Doorbell button"
source = "push:button"
endpoint = 40
poll_ms = 10
debounce_ms = 0
long_press_ms = 400
multi_press_ms = 250
multi_press_max = 3

[[matter.endpoints]]
kind = "generic_switch"
name = "Rocker"
source = "push:rocker"
switch_mode = "latching"
endpoint = 41
poll_ms = 10
debounce_ms = 0

# --- More "detected" sensors and a soil sensor (Matter 1.4 / 1.5) --------------

[[matter.endpoints]]
kind = "water_leak_sensor"
name = "Basement leak"
source = "push:leak"
endpoint = 50
poll_ms = 100

[[matter.endpoints]]
kind = "rain_sensor"
name = "Roof rain"
source = "push:rain"
endpoint = 51
poll_ms = 100

[[matter.endpoints]]
kind = "water_freeze_sensor"
name = "Pipe freeze"
source = "push:freeze"
endpoint = 52
poll_ms = 100

[[matter.endpoints]]
kind = "soil_moisture_sensor"
name = "Planter"
source = "push:soil"
endpoint = 53
poll_ms = 100

# --- Camera-AI sources and the occupancy hold time ----------------------------
# The harness boots with [ai] enabled but no model to load, so the inference
# engine never starts: an `ai:` source must read "no reading", NOT "nobody
# there". The mock/synthetic camera makes AI data Mock, hence allow_mock here.

[[matter.endpoints]]
kind = "occupancy_sensor"
name = "Person (AI)"
source = "ai:class:person"
occupancy_type = "vision"
allow_mock = true
hold_ms = 5000
endpoint = 60
poll_ms = 100

# Same source WITHOUT allow_mock: synthetic detections must be refused, so this
# endpoint must be absent from the node.
[[matter.endpoints]]
kind = "occupancy_sensor"
name = "Person (AI, refused)"
source = "ai:any"
occupancy_type = "vision"
endpoint = 61

# A held occupancy sensor: stays occupied for 1.5 s after the source clears.
[[matter.endpoints]]
kind = "occupancy_sensor"
name = "Held presence"
source = "push:held_presence"
hold_ms = 1500
endpoint = 62
poll_ms = 100

# --- Air quality: ONE endpoint, several measurements ---------------------------
# AirQuality is derived from the graded pollutants (CO2, PM2.5, ...); TVOC is
# reported but not graded.

[[matter.endpoints]]
kind = "air_quality_sensor"
name = "Living room air"
sources = { co2 = "push:co2", pm25 = "push:pm25", tvoc = "push:tvoc", temperature = "push:aq_temp", humidity = "push:aq_rh" }
endpoint = 70
poll_ms = 100

# A monitor that computes its own level supplies it directly; it wins over the
# level derived from the concentrations.
[[matter.endpoints]]
kind = "air_quality_sensor"
name = "Smart monitor"
sources = { air_quality = "push:aq_level", pm10 = "push:pm10" }
scales = { pm10 = 1.0 }
endpoint = 71
poll_ms = 100
