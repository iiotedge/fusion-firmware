name: CI

# workflow_call: lets release.yml require this exact same gate (fmt, clippy,
# test, security audit, aarch64 cross-check) before it builds/publishes a
# release, instead of duplicating the job bodies in a second workflow file.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: fmt + clippy + test (Linux host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # iiotedge-core/-storage/-security/-protocols are path dependencies on
      # a sibling checkout (see Cargo.toml: ../iiotedge-lib/crates/*) — a
      # separate, private SDK repo (github.com/iiotedge/iiotedge-sdk), not
      # vendored here. `path: ../iiotedge-lib` places it exactly where Cargo
      # expects, one level up from this checkout. Needs IIOTEDGE_SDK_TOKEN
      # (repo secret: a PAT or deploy key with at least read access to
      # iiotedge/iiotedge-sdk) — the default GITHUB_TOKEN can't reach
      # another repo in the org.
      - name: Checkout iiotedge-sdk (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: iiotedge/iiotedge-sdk
          token: ${{ secrets.IIOTEDGE_SDK_TOKEN }}
          path: ../iiotedge-lib

      # gstreamer/glib -sys crates probe pkg-config in their build scripts;
      # rumqttc TLS needs libssl.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # No --all: this is not a cargo workspace, but `cargo fmt --all` still
      # sweeps in path dependencies via cargo metadata's full resolve graph
      # (a known cargo-fmt quirk, unrelated to `cargo build --all`'s
      # meaning) — including the sibling iiotedge-sdk checkout, which isn't
      # this repo's to fix if its own fmt/build has an issue. Scope to just
      # this crate.
      - name: rustfmt
        run: cargo fmt -- --check

      # Runs on Linux, so this also lints the V4L2/ISP backends that are
      # cfg-gated away on macOS dev machines.
      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: tests
        run: cargo test

  security-audit:
    name: cargo audit (RustSec advisory DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only reads Cargo.lock — no sibling iiotedge-sdk checkout or build
      # needed, this doesn't compile anything.
      - uses: rustsec/audit-check@v2
        # Non-blocking until the first run's findings (if any) are triaged —
        # flip to blocking (delete this line) once existing advisories are
        # either fixed or explicitly accepted via an ignore list.
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cross-aarch64:
    name: cross-check aarch64 (i.MX 8M Plus target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout iiotedge-sdk (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: iiotedge/iiotedge-sdk
          token: ${{ secrets.IIOTEDGE_SDK_TOKEN }}
          path: ../iiotedge-lib

      - name: Build cross toolchain image
        run: docker build -t iiotedge-builder -f Dockerfile.cross .

      # Mirrors the Makefile's own docker invocation (IIOTEDGE_LIB_DIR):
      # ../iiotedge-lib mounted at /iiotedge-lib so the manifest's relative
      # path dependencies resolve inside the container the same way they do
      # for a local `make docker-release`.
      - name: cargo check --target aarch64-unknown-linux-gnu
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -v "$PWD/../iiotedge-lib":/iiotedge-lib \
            -e CARGO_TARGET_DIR=/tmp/target \
            iiotedge-builder cargo check --target aarch64-unknown-linux-gnu
