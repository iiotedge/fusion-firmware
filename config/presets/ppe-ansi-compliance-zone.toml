# =====================================================================
# PRESET: PPE / safety-compliance zone monitoring
# Use case: a hazard-adjacent work area (chemical handling, welding bay,
# high-noise zone) where anyone present must be wearing required PPE.
#
# IMPORTANT MODEL CAVEAT: the stock yolov8n COCO-80 model this firmware
# ships with can detect "person" — it CANNOT classify helmet/vest/
# goggles presence (COCO has no PPE classes). This preset's zone/
# workflow scaffolding (presence rule → evidence → warning beacon →
# EHS webhook) is real and works today with the stock model as a
# "person entered PPE-required zone, go verify" alert. True automated
# PPE compliance (has-helmet vs. no-helmet) needs a custom-trained
# model swapped in via ai.model_path/ai.labels — same config surface,
# no firmware change required once that model exists.
#
# Customized vs config/iiotedge_default.toml: [[ai.rules]] presence rule
# with a raised min_confidence (compliance alerts need to be trustworthy,
# not just "probably"), gpio_output amber beacon, extended clip window
# for audit review, longer clip retention cap.
# =====================================================================

[system]
device_id = "cam-welding-bay-02"
facility_id = "00000000-0000-0000-0000-000000000000"
log_level = "INFO"
log_format = "TEXT"
queue_capacity = 5
metrics_enabled = true
metrics_port = 9100
warn_temp_c = 80.0

[camera]
type = "GST_V4L2"
device_node = "/dev/video0"
source_params = "io-mode=4"
width = 1920
height = 1080
fps = 30
format = "NV12"
auto_exposure = false
exposure_time_us = 12000
gain = 10

[audio]
enabled = false
source = "auto"
codec = "opus"
bitrate_kbps = 64
sample_rate = 48000
channels = 1

[ai]
enabled = true
# Swap to a custom PPE-classifier model here once trained; labels below
# would then list its actual classes (e.g. "person_helmet",
# "person_no_helmet") instead of stock COCO-80.
model_path = "/opt/iiotedge/models/yolov8n.rknn"
runtime = "rknn"
hardware_delegate = "CPU"
parser = "yolov8"
confidence_threshold = 0.60
nms_iou_threshold = 0.45
inference_fps_limit = 5
input_width = 640
input_height = 640
labels = [
  "person", "bicycle", "car", "motorcycle", "airplane", "bus", "train", "truck", "boat",
  "traffic light", "fire hydrant", "stop sign", "parking meter", "bench", "bird", "cat",
  "dog", "horse", "sheep", "cow", "elephant", "bear", "zebra", "giraffe", "backpack",
  "umbrella", "handbag", "tie", "suitcase", "frisbee", "skis", "snowboard", "sports ball",
  "kite", "baseball bat", "baseball glove", "skateboard", "surfboard", "tennis racket",
  "bottle", "wine glass", "cup", "fork", "knife", "spoon", "bowl", "banana", "apple",
  "sandwich", "orange", "broccoli", "carrot", "hot dog", "pizza", "donut", "cake", "chair",
  "couch", "potted plant", "bed", "dining table", "toilet", "tv", "laptop", "mouse",
  "remote", "keyboard", "cell phone", "microwave", "oven", "toaster", "sink", "refrigerator",
  "book", "clock", "vase", "scissors", "teddy bear", "hair drier", "toothbrush",
]
class_filter = ["person"]
intra_threads = 2
roi = []

[[ai.rules]]
name = "ppe_zone_entry"
enabled = true
mode = "presence"
classes = ["person"]
min_confidence = 0.80
zone = [[0.15, 0.20], [0.85, 0.20], [0.85, 0.95], [0.15, 0.95]]
actions = ["snapshot", "clip", "gpio_output", "webhook"]
webhook_url = "https://example.com/hooks/ehs-compliance"
gpio_chip = "/dev/gpiochip0"
gpio_line = 22
gpio_pulse_ms = 2000

[stream]
enabled = true
codec = "h264"
encoder = "auto"
encoder_params = ""
bitrate_kbps = 4096
gop_size = 60
rtsp_port = 8554
rtsp_path = "/live"
osd_overlay_enabled = true
rtsp_latency_ms = 0

[tamper]
enabled = true
analysis_fps = 4
alarm_after_s = 3
recover_after_s = 5
dark_luma_max = 30.0
bright_luma_min = 225.0
low_detail_min = 1.5
freeze_diff_max = 0.2
scene_change_min = 60.0
overlay_border = true

[motion]
enabled = true
analysis_fps = 5
sensitivity = 12.0
alarm_after_frames = 2
recover_after_s = 3

[schedule]
enabled = false

[overlay]
enabled = true
show_timestamp = true
timestamp_format = "%Y-%m-%d %H:%M:%S"
show_device_id = true
custom_text = "WELDING BAY 2 — PPE REQUIRED"
font = "Sans, 18"
show_ai_boxes = true
ai_box_ttl_ms = 1500

[correlation]
enabled = true
tolerance_ms = 200

[cluster]
enabled = false
priority = 100
announce_interval_s = 10
accept_remote_commands = false

[cluster.wifi]
enabled = true
multicast_group = "239.255.77.77"
port = 8778
ttl = 1

[cluster.bluetooth]
enabled = false
adapter = ""
scan_interval_ms = 1000

[cluster.fusion]
enabled = false
tolerance_ms = 3000

[cloud_relay]
enabled = true

[security]
rtsp_auth = true
onvif_auth = true
command_token = "CHANGE-ME-generate-a-unique-random-token-per-device"
api_token = "CHANGE-ME-generate-a-unique-random-token-per-device"
[[security.users]]
username = "admin"
password = "CHANGE-ME"
role = "admin"

[onboarding]
enabled = true

[onvif]
enabled = true
port = 8000
discovery_enabled = true
manufacturer = "IIoTEdge"
model = "IIoTEdge Vision Node"
hardware_id = "radxa-zero-3e"

[ptz]
enabled = false
driver = "pelco_d"
serial_device = "/dev/ttyUSB0"
baud_rate = 2400
address = 0
move_timeout_s = 5

[snmp]
enabled = false
port = 161
community = "public"
sys_contact = ""
sys_location = ""
trap_host = ""
trap_port = 162

# Extended clip window + larger retention cap — compliance/HR review
# needs a wide margin around the entry moment, and audit trails get
# pulled well after the fact, not same-day.
[storage]
enabled = true
path = "recordings"
chunk_seconds = 60
max_total_mb = 2048
max_age_hours = 0
snapshots_enabled = true
snapshot_quality = 90
snapshot_min_interval_s = 5
clips_enabled = true
clip_pre_roll_s = 45
clip_post_roll_s = 45
max_clips_mb = 3072
min_free_mb = 512

[storage.sd]
enabled = false
mount_path = "/media/usb"
auto = true
upload_chunks = true
upload_clips = true
upload_snapshots = true
scan_interval_s = 30
button_gpio_chip = ""
button_gpio_line = 0
button_active_low = true

[storage.ftp]
enabled = false
host = ""
port = 21
username = "admin"
password = "CHANGE-ME"
tls = false
insecure_skip_verify = false
remote_dir = "/"
upload_chunks = false
upload_clips = true
upload_snapshots = true
scan_interval_s = 60
delete_after_upload = false

[telemetry]
enabled = true
edge_config = "config/edge.toml"
health_ping_interval_sec = 60

[watchdog]
thread_timeout_ms = 8000
max_consecutive_dropped_frames = 300
