# =====================================================================
# PRESET: Radar sensing end-to-end demo (mock backend)
# Use case: NOT a real deployment scenario — this exists to let you see
# the whole radar pipeline actually run and produce real events, with
# zero hardware and zero extra setup: RadarSource (mock, a synthetic
# sweeping track) -> RadarAnalyzer (zone presence/line-cross/loiter) ->
# telemetry "radar_event" -> cluster "radar_zone" broadcast -> cross-
# device fusion ("fused_radar_zone") if a second device joins the mesh.
#
# Deploy this (`cp` over config/iiotedge_default.toml, or `make run`
# locally against the mock camera too) and watch the logs: "Radar zone
# event" fires every few seconds as the synthetic track sweeps through
# each configured zone — see src/radar/mock.rs for exactly how it moves
# (azimuth sweeps the full FOV and back, range closes and opens, in a
# ~10s cycle at the mock's fixed 100ms frame interval).
#
# Once a real radar backend exists (see src/radar/mod.rs's header
# comment for why none are built yet), swap `[radar].type` to it and
# everything downstream — zones, analytics, telemetry, fusion — works
# unchanged; only the HAL layer differs. This preset's real news is the
# radar config shape and the fact the pipeline genuinely runs end to end
# today, not a specific zone layout worth deploying as-is.
# =====================================================================

[system]
device_id = "cam-radar-demo-01"
facility_id = "00000000-0000-0000-0000-000000000000"
log_level = "INFO"
log_format = "TEXT"
queue_capacity = 5
metrics_enabled = true
metrics_port = 9100
warn_temp_c = 80.0

[camera]
type = "GST_V4L2"
device_node = "/dev/video0"
source_params = "io-mode=4"
width = 1920
height = 1080
fps = 30
format = "NV12"
auto_exposure = true
exposure_time_us = 15000
gain = 12

[audio]
enabled = false
source = "auto"
codec = "opus"
bitrate_kbps = 64
sample_rate = 48000
channels = 1

[ai]
enabled = true
model_path = "/opt/iiotedge/models/yolov8n.rknn"
runtime = "rknn"
hardware_delegate = "CPU"
parser = "yolov8"
confidence_threshold = 0.60
nms_iou_threshold = 0.45
inference_fps_limit = 5
input_width = 640
input_height = 640
labels = [
  "person", "bicycle", "car", "motorcycle", "airplane", "bus", "train", "truck", "boat",
  "traffic light", "fire hydrant", "stop sign", "parking meter", "bench", "bird", "cat",
  "dog", "horse", "sheep", "cow", "elephant", "bear", "zebra", "giraffe", "backpack",
  "umbrella", "handbag", "tie", "suitcase", "frisbee", "skis", "snowboard", "sports ball",
  "kite", "baseball bat", "baseball glove", "skateboard", "surfboard", "tennis racket",
  "bottle", "wine glass", "cup", "fork", "knife", "spoon", "bowl", "banana", "apple",
  "sandwich", "orange", "broccoli", "carrot", "hot dog", "pizza", "donut", "cake", "chair",
  "couch", "potted plant", "bed", "dining table", "toilet", "tv", "laptop", "mouse",
  "remote", "keyboard", "cell phone", "microwave", "oven", "toaster", "sink", "refrigerator",
  "book", "clock", "vase", "scissors", "teddy bear", "hair drier", "toothbrush",
]
class_filter = []
intra_threads = 2
roi = []

[stream]
enabled = true
codec = "h264"
encoder = "auto"
encoder_params = ""
bitrate_kbps = 4096
gop_size = 60
rtsp_port = 8554
rtsp_path = "/live"
osd_overlay_enabled = true
rtsp_latency_ms = 0

[tamper]
enabled = true
analysis_fps = 4
alarm_after_s = 3
recover_after_s = 5
dark_luma_max = 30.0
bright_luma_min = 225.0
low_detail_min = 1.5
freeze_diff_max = 0.2
scene_change_min = 60.0
overlay_border = true

[motion]
enabled = true
analysis_fps = 5
sensitivity = 12.0
alarm_after_frames = 2
recover_after_s = 3

[schedule]
enabled = false

[overlay]
enabled = true
show_timestamp = true
timestamp_format = "%Y-%m-%d %H:%M:%S"
show_device_id = true
custom_text = "RADAR DEMO (mock)"
font = "Sans, 18"
show_ai_boxes = true
ai_box_ttl_ms = 1500

[correlation]
enabled = true
tolerance_ms = 200

# Cluster mesh ON so a second device running this same preset (with a
# different device_id/priority) demonstrates cross-device radar fusion —
# both nodes' synthetic tracks are independent/unsynchronized, so a real
# "fused_radar_zone" event needs the two mock sweeps to coincidentally
# overlap in time; this is here to prove the wiring works, not to be a
# reliable demo of fusion timing.
[cluster]
enabled = true
priority = 100
announce_interval_s = 10
accept_remote_commands = false

[cluster.wifi]
enabled = true
multicast_group = "239.255.77.77"
port = 8778
ttl = 1

[cluster.bluetooth]
enabled = false
adapter = ""
scan_interval_ms = 1000

[cluster.fusion]
enabled = true
tolerance_ms = 5000

[cloud_relay]
enabled = true

[security]
rtsp_auth = true
onvif_auth = true
command_token = "CHANGE-ME-generate-a-unique-random-token-per-device"
api_token = "CHANGE-ME-generate-a-unique-random-token-per-device"
[[security.users]]
username = "admin"
password = "CHANGE-ME"
role = "admin"

[onboarding]
enabled = true

[home_assistant]
enabled = false
discovery_prefix = "homeassistant"
device_name = ""
off_delay_s = 10

[onvif]
enabled = true
port = 8000
discovery_enabled = true
manufacturer = "IIoTEdge"
model = "IIoTEdge Vision Node"
hardware_id = "radxa-zero-3e"

[ptz]
enabled = false
driver = "pelco_d"
serial_device = "/dev/ttyUSB0"
baud_rate = 2400
address = 0
move_timeout_s = 5

[snmp]
enabled = false
port = 161
community = "public"
sys_contact = ""
sys_location = ""
trap_host = ""
trap_port = 162

[storage]
enabled = true
path = "recordings"
chunk_seconds = 60
max_total_mb = 2048
max_age_hours = 0
snapshots_enabled = true
snapshot_quality = 85
snapshot_min_interval_s = 5
clips_enabled = true
clip_pre_roll_s = 30
clip_post_roll_s = 30
max_clips_mb = 1024
min_free_mb = 512

[storage.sd]
enabled = false
mount_path = "/media/usb"
auto = true
upload_chunks = true
upload_clips = true
upload_snapshots = true
scan_interval_s = 30
button_gpio_chip = ""
button_gpio_line = 0
button_active_low = true

[storage.ftp]
enabled = false
host = ""
port = 21
username = "admin"
password = "CHANGE-ME"
tls = false
insecure_skip_verify = false
remote_dir = "/"
upload_chunks = false
upload_clips = true
upload_snapshots = true
scan_interval_s = 60
delete_after_upload = false

[telemetry]
enabled = true
edge_config = "config/edge.toml"
health_ping_interval_sec = 60

[watchdog]
thread_timeout_ms = 8000
max_consecutive_dropped_frames = 300

# The actual point of this preset: radar enabled, mock backend, three
# zones exercising all three analytics modes at once (see src/radar/
# analytics.rs) so every code path produces a real, watchable event.
[radar]
enabled = true
type = "mock"
transport = ""
baud_rate = 115200
range_min_m = 0.5
range_max_m = 50.0
fov_deg = 120.0
mount_x_m = 0.0
mount_y_m = 0.0
mount_z_m = 0.0
mount_roll_deg = 0.0
mount_pitch_deg = 0.0
mount_yaw_deg = 0.0

# The synthetic track's range closes from range_max_m to range_min_m and
# back — this zone spans that whole travel path directly ahead (azimuth
# 0), so "presence" fires as soon as the mock starts sweeping.
[[radar.zones]]
name = "approach_zone"
mode = "presence"
points = [[-15.0, 1.0], [15.0, 1.0], [15.0, 45.0], [-15.0, 45.0]]

# A line across the track's straight-ahead path at 25m — the mock's
# range oscillates through this depth every sweep, so this fires
# repeatedly as it passes through in both directions ("either").
[[radar.zones]]
name = "midpoint_gate"
mode = "line_cross"
points = [[-15.0, 25.0], [15.0, 25.0]]
direction = "either"

# A wide polygon covering nearly the whole FOV/range — the mock spends
# real time transiting it each sweep, enough to demonstrate dwell_s
# actually elapsing (short here so it fires quickly in a demo, not a
# realistic loitering threshold for a real deployment).
[[radar.zones]]
name = "wide_area_loiter"
mode = "loiter"
points = [[-25.0, 1.0], [25.0, 1.0], [25.0, 50.0], [-25.0, 50.0]]
dwell_s = 3
