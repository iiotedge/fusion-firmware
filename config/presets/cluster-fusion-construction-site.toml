# =====================================================================
# PRESET: Cluster fusion — construction site (temporary/mobile deployment)
# Use case: a temporary jobsite mesh — perimeter camera + equipment/
# laydown-yard camera — coordinating over WiFi multicast with NO
# assumption of a stable uplink back to an office network (construction
# sites routinely have poor/no fixed connectivity). Equipment theft and
# after-hours trespassing are the two real risks this preset targets:
# a person or vehicle on site after hours, or equipment lingering near
# the site exit long enough to look like it's being loaded out.
#
# This is camera "perimeter" in a 2+ camera mesh — deploy the same file
# as "equipment-yard" with a different device_id, distinct
# [cluster].priority, and a yard-specific zone.
#
# Customized vs config/iiotedge_default.toml: [cluster] on (wifi +
# fusion + reactions, no bluetooth — BLE range is too short for a large
# open site), [[ai.rules]] after-hours presence + equipment-dwell loiter
# (vehicle/truck classes stand in for heavy equipment, no COCO class for
# excavator/loader), [storage.sd] on with auto-mirror (SD/USB export is
# the fallback when there's no reliable uplink at all), outdoor exposure
# tuning for an unlit/harsh site.
# =====================================================================

[system]
device_id = "cam-jobsite-perimeter-north"
facility_id = "00000000-0000-0000-0000-000000000000"
log_level = "INFO"
log_format = "TEXT"
queue_capacity = 5
metrics_enabled = true
metrics_port = 9100
warn_temp_c = 80.0

[camera]
type = "GST_V4L2"
device_node = "/dev/video0"
source_params = "io-mode=4"
width = 1920
height = 1080
fps = 20
format = "NV12"
# Unlit/variable-light open site — auto-exposure, raised gain floor for
# usable night frames without dedicated IR illuminators.
auto_exposure = true
exposure_time_us = 20000
gain = 18

[audio]
enabled = false
source = "auto"
codec = "opus"
bitrate_kbps = 64
sample_rate = 48000
channels = 1

[ai]
enabled = true
model_path = "/opt/iiotedge/models/yolov8n.rknn"
runtime = "rknn"
hardware_delegate = "CPU"
parser = "yolov8"
confidence_threshold = 0.60
nms_iou_threshold = 0.45
inference_fps_limit = 5
input_width = 640
input_height = 640
labels = [
  "person", "bicycle", "car", "motorcycle", "airplane", "bus", "train", "truck", "boat",
  "traffic light", "fire hydrant", "stop sign", "parking meter", "bench", "bird", "cat",
  "dog", "horse", "sheep", "cow", "elephant", "bear", "zebra", "giraffe", "backpack",
  "umbrella", "handbag", "tie", "suitcase", "frisbee", "skis", "snowboard", "sports ball",
  "kite", "baseball bat", "baseball glove", "skateboard", "surfboard", "tennis racket",
  "bottle", "wine glass", "cup", "fork", "knife", "spoon", "bowl", "banana", "apple",
  "sandwich", "orange", "broccoli", "carrot", "hot dog", "pizza", "donut", "cake", "chair",
  "couch", "potted plant", "bed", "dining table", "toilet", "tv", "laptop", "mouse",
  "remote", "keyboard", "cell phone", "microwave", "oven", "toaster", "sink", "refrigerator",
  "book", "clock", "vase", "scissors", "teddy bear", "hair drier", "toothbrush",
]
class_filter = ["person", "car", "truck"]
intra_threads = 2
roi = []

[[ai.rules]]
name = "after_hours_site_presence"
enabled = true
mode = "presence"
classes = ["person", "car", "truck"]
zone = [[0.0, 0.0], [1.0, 0.0], [1.0, 1.0], [0.0, 1.0]]
actions = ["snapshot", "clip", "cluster_broadcast", "webhook"]
webhook_url = "https://example.com/hooks/jobsite-security"
[ai.rules.schedule]
enabled = true
windows = [{ days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"], start = "18:00", end = "06:00" }]

# Equipment/vehicle lingering near the perimeter long enough to look
# like a loadout in progress, not a normal work stop.
[[ai.rules]]
name = "equipment_dwell_near_exit"
enabled = true
mode = "loiter"
classes = ["truck", "car"]
zone = [[0.05, 0.55], [0.95, 0.55], [0.95, 0.98], [0.05, 0.98]]
dwell_s = 300
actions = ["snapshot", "cluster_broadcast", "webhook"]
webhook_url = "https://example.com/hooks/jobsite-security"

[stream]
enabled = true
codec = "h264"
encoder = "auto"
encoder_params = ""
bitrate_kbps = 2048
gop_size = 40
rtsp_port = 8554
rtsp_path = "/live"
osd_overlay_enabled = true
rtsp_latency_ms = 0

[tamper]
enabled = true
analysis_fps = 4
alarm_after_s = 3
recover_after_s = 5
dark_luma_max = 20.0
bright_luma_min = 225.0
low_detail_min = 1.5
freeze_diff_max = 0.2
scene_change_min = 60.0
overlay_border = true

[motion]
enabled = true
analysis_fps = 5
sensitivity = 12.0
alarm_after_frames = 2
recover_after_s = 3

[schedule]
enabled = false

[overlay]
enabled = true
show_timestamp = true
timestamp_format = "%Y-%m-%d %H:%M:%S"
show_device_id = true
custom_text = "JOBSITE — NORTH PERIMETER"
font = "Sans, 18"
show_ai_boxes = true
ai_box_ttl_ms = 1500

[correlation]
enabled = true
tolerance_ms = 200

[cluster]
enabled = true
priority = 100
announce_interval_s = 10
accept_remote_commands = true

[cluster.wifi]
enabled = true
multicast_group = "239.255.77.77"
port = 8778
ttl = 1

# BLE range is too short to be useful across a large open jobsite —
# WiFi multicast alone covers this deployment.
[cluster.bluetooth]
enabled = false
adapter = ""
scan_interval_ms = 1000

[cluster.fusion]
enabled = true
tolerance_ms = 5000

[[cluster.reactions]]
on_kind = "ai_event"
snapshot = false
remote_cmd = "reanalyze"
remote_target = "*"

[[cluster.reactions]]
on_kind = "tamper_event"
snapshot = true
remote_cmd = "snapshot"
remote_target = "*"

# Jobsites routinely have no reliable uplink at all — cloud relay stays
# available on-demand but isn't relied on as the primary evidence path.
[cloud_relay]
enabled = true

[security]
rtsp_auth = true
onvif_auth = true
command_token = "CHANGE-ME-generate-a-unique-random-token-per-device"
api_token = "CHANGE-ME-generate-a-unique-random-token-per-device"
[[security.users]]
username = "admin"
password = "CHANGE-ME"
role = "admin"

[onboarding]
enabled = true

[onvif]
enabled = true
port = 8000
discovery_enabled = true
manufacturer = "IIoTEdge"
model = "IIoTEdge Vision Node"
hardware_id = "radxa-zero-3e"

[ptz]
enabled = false
driver = "pelco_d"
serial_device = "/dev/ttyUSB0"
baud_rate = 2400
address = 0
move_timeout_s = 5

[snmp]
enabled = false
port = 161
community = "public"
sys_contact = ""
sys_location = ""
trap_host = ""
trap_port = 162

# SD/USB export is the real evidence fallback on a site with no
# reliable network at all — continuous auto-mirror, not manual-only.
[storage]
enabled = true
path = "recordings"
chunk_seconds = 60
max_total_mb = 8192
max_age_hours = 0
snapshots_enabled = true
snapshot_quality = 85
snapshot_min_interval_s = 5
clips_enabled = true
clip_pre_roll_s = 30
clip_post_roll_s = 30
max_clips_mb = 2048
min_free_mb = 512

[storage.sd]
enabled = true
mount_path = "/media/usb"
auto = true
upload_chunks = true
upload_clips = true
upload_snapshots = true
scan_interval_s = 30
button_gpio_chip = ""
button_gpio_line = 0
button_active_low = true

[storage.ftp]
enabled = false
host = ""
port = 21
username = "admin"
password = "CHANGE-ME"
tls = false
insecure_skip_verify = false
remote_dir = "/"
upload_chunks = false
upload_clips = true
upload_snapshots = true
scan_interval_s = 60
delete_after_upload = false

[telemetry]
enabled = true
edge_config = "config/edge.toml"
health_ping_interval_sec = 60

[watchdog]
thread_timeout_ms = 8000
max_consecutive_dropped_frames = 300
