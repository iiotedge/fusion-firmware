# =====================================================================
# PRESET: Production-line HMI-on-video (machine-data correlation + widgets)
# Use case: a conveyor/inspection-station camera whose job is proving
# "what the line was doing" at the moment of a PLC-reported reject —
# not AI object detection. AI is turned OFF here on purpose (the
# upstream vision/PLC system already does the inspection; this camera's
# value is machine-data correlation + burning live process values onto
# the footage, and running AI inference for nothing would just burn
# NPU/CPU headroom this use case doesn't need).
#
# Customized vs config/iiotedge_default.toml: [ai] disabled,
# [[correlation.rules]] pairs a PLC reject tag with an evidence
# snapshot+clip, [[overlay.widgets]] burns line throughput/speed/reject
# count onto the stream and recordings, [audio] on for bearing/line-noise
# anomaly listening, tight fixed exposure for a fast-moving conveyor.
# =====================================================================

[system]
device_id = "cam-line3-inspection-01"
facility_id = "00000000-0000-0000-0000-000000000000"
log_level = "INFO"
log_format = "TEXT"
queue_capacity = 5
metrics_enabled = true
metrics_port = 9100
warn_temp_c = 80.0

[camera]
type = "GST_V4L2"
device_node = "/dev/video0"
source_params = "io-mode=4"
width = 1920
height = 1080
fps = 30
format = "NV12"
# Fast-moving conveyor: locked, very short exposure freezes motion
# instead of motion-blurring parts into an unreadable smear.
auto_exposure = false
exposure_time_us = 5000
gain = 16

# Bearing/motor noise anomaly listening — the same microphone feed also
# lands in every recording chunk, so an audible anomaly and its exact
# video moment are always reviewable together.
[audio]
enabled = true
source = "auto"
codec = "opus"
bitrate_kbps = 64
sample_rate = 48000
channels = 1

# AI off: this station's inspection/reject decision is already made
# upstream by the PLC/vision system feeding correlation.rules below —
# running a second, redundant detector here would only cost compute.
[ai]
enabled = false
model_path = "/opt/iiotedge/models/yolov8n.rknn"
runtime = "rknn"
hardware_delegate = "CPU"
parser = "yolov8"
confidence_threshold = 0.60
nms_iou_threshold = 0.45
inference_fps_limit = 5
input_width = 640
input_height = 640
labels = []
class_filter = []
intra_threads = 2
roi = []

[stream]
enabled = true
codec = "h264"
encoder = "auto"
encoder_params = ""
bitrate_kbps = 4096
gop_size = 60
rtsp_port = 8554
rtsp_path = "/live"
osd_overlay_enabled = true
rtsp_latency_ms = 0

[tamper]
enabled = true
analysis_fps = 4
alarm_after_s = 3
recover_after_s = 5
dark_luma_max = 30.0
bright_luma_min = 225.0
low_detail_min = 1.5
freeze_diff_max = 0.2
scene_change_min = 60.0
overlay_border = true

[motion]
enabled = false
analysis_fps = 5
sensitivity = 12.0
alarm_after_frames = 2
recover_after_s = 3

[schedule]
enabled = false

[overlay]
enabled = true
show_timestamp = true
timestamp_format = "%Y-%m-%d %H:%M:%S"
show_device_id = true
custom_text = "LINE 3 — INSPECTION"
font = "Sans, 18"
show_ai_boxes = false
ai_box_ttl_ms = 1500

# Sparkline/gauge/value widgets — the actual point of this preset:
# process data burned live onto the footage AND every recorded chunk.
[[overlay.widgets]]
kind = "sparkline"
label = "THROUGHPUT/MIN"
source = "modbus/plc1/line3_throughput"
json_field = ""
min = 0.0
max = 0.0
x = 40
y = 40
width = 420
height = 130
window_s = 180

[[overlay.widgets]]
kind = "gauge"
label = "BELT SPEED"
source = "modbus/plc1/line3_belt_speed"
json_field = ""
min = 0.0
max = 2.0
x = 40
y = 190
width = 300
height = 60
window_s = 60

[[overlay.widgets]]
kind = "value"
label = "REJECTS/SHIFT"
source = "modbus/plc1/line3_reject_count"
json_field = ""
min = 0.0
max = 0.0
x = 40
y = 270
width = 260
height = 60
window_s = 60

# The actual evidence trigger: a PLC-reported reject pairs the machine
# event with the frame on screen at that exact moment.
[correlation]
enabled = true
tolerance_ms = 150
[[correlation.rules]]
name = "reject_part"
source_prefix = "modbus/plc1/reject"
contains = "REJECT"
snapshot = true
clip = true

[cluster]
enabled = false
priority = 100
announce_interval_s = 10
accept_remote_commands = false

[cluster.wifi]
enabled = true
multicast_group = "239.255.77.77"
port = 8778
ttl = 1

[cluster.bluetooth]
enabled = false
adapter = ""
scan_interval_ms = 1000

[cluster.fusion]
enabled = false
tolerance_ms = 3000

[cloud_relay]
enabled = true

[security]
rtsp_auth = true
onvif_auth = true
command_token = "CHANGE-ME-generate-a-unique-random-token-per-device"
api_token = "CHANGE-ME-generate-a-unique-random-token-per-device"
[[security.users]]
username = "admin"
password = "CHANGE-ME"
role = "admin"

[onboarding]
enabled = true

[onvif]
enabled = true
port = 8000
discovery_enabled = true
manufacturer = "IIoTEdge"
model = "IIoTEdge Vision Node"
hardware_id = "radxa-zero-3e"

[ptz]
enabled = false
driver = "pelco_d"
serial_device = "/dev/ttyUSB0"
baud_rate = 2400
address = 0
move_timeout_s = 5

[snmp]
enabled = false
port = 161
community = "public"
sys_contact = ""
sys_location = ""
trap_host = ""
trap_port = 162

[storage]
enabled = true
path = "recordings"
chunk_seconds = 60
max_total_mb = 2048
max_age_hours = 0
snapshots_enabled = true
snapshot_quality = 90
snapshot_min_interval_s = 2
clips_enabled = true
clip_pre_roll_s = 10
clip_post_roll_s = 10
max_clips_mb = 2048
min_free_mb = 512

[storage.sd]
enabled = false
mount_path = "/media/usb"
auto = true
upload_chunks = true
upload_clips = true
upload_snapshots = true
scan_interval_s = 30
button_gpio_chip = ""
button_gpio_line = 0
button_active_low = true

[storage.ftp]
enabled = false
host = ""
port = 21
username = "admin"
password = "CHANGE-ME"
tls = false
insecure_skip_verify = false
remote_dir = "/"
upload_chunks = false
upload_clips = true
upload_snapshots = true
scan_interval_s = 60
delete_after_upload = false

[telemetry]
enabled = true
edge_config = "config/edge.toml"
health_ping_interval_sec = 60

[watchdog]
thread_timeout_ms = 8000
max_consecutive_dropped_frames = 300
